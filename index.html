<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmaCIA - Realidad Aumentada</title>
  
  <!-- Carga del componente web oficial de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #f4f4f9;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
    }
    .ar-button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Componente 3D / AR con tu modelo farmaCIA.glb -->
  <model-viewer 
    src="https://raw.githubusercontent.com/negritoeduardo/cat-3d/main/farmaCIA.glb" 
    ar 
    ar-modes="scene-viewer webxr quick-look" 
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1"
    alt="Modelo 3D de Farmacia">
    
    <button slot="ar-button" class="ar-button">
      Ver en tu espacio (AR) 📱
    </button>
    
  </model-viewer>

</body>
</html>
